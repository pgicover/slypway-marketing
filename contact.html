<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talk to us: Slypway</title>
<meta name="description" content="Tell Slypway what you write and where. A member of the team replies within 2 business days.">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('sw-theme')||'dark';}catch(e){}</script>
<link rel="stylesheet" href="/assets/prelaunch.css?v=3">
</head>
<body>

<header class="sw-header sw-rise" style="animation-delay:0ms">
  <a class="sw-wordmark" href="/index.html">Slypway</a>
  <div class="sw-header-right">
    <a class="sw-back" href="/index.html">&larr; Back</a>
    <div class="sw-toggle" role="group" aria-label="Color mode">
      <button type="button" data-theme-button="dark" data-mode="dark">Dark</button>
      <button type="button" data-theme-button="light" data-mode="light">Light</button>
    </div>
  </div>
</header>

<main style="flex:1;width:100%;max-width:560px;margin:0 auto;padding:56px 20px 72px">
  <div class="sw-eyebrow sw-eyebrow-accent sw-rise" style="animation-delay:200ms">For MGAs and carriers</div>
  <h1 class="sw-rise" style="animation-delay:350ms;margin:16px 0 0;max-width:18ch;font-family:var(--font-heading);font-weight:600;font-size:28px;line-height:1.15;letter-spacing:-0.03em">Talk to us.</h1>
  <p class="sw-rise" style="animation-delay:500ms;margin:10px 0 0;font-size:14px;line-height:1.6;color:var(--sw-muted)">Tell us what you write and where. A member of the team replies within 2 business days.</p>

  <form id="contact-form" class="sw-contact-grid sw-rise" style="animation-delay:650ms" novalidate>
    <label class="sw-form-field">
      <span class="sw-label">Name</span>
      <input class="sw-field-underline" id="name" name="name" required placeholder="Full name">
    </label>
    <label class="sw-form-field">
      <span class="sw-label">Work email</span>
      <input class="sw-field-underline" id="email" name="email" type="email" required placeholder="you@company.ca">
    </label>
    <label class="sw-form-field">
      <span class="sw-label">Company</span>
      <input class="sw-field-underline" id="company" name="company" placeholder="Company name">
    </label>
    <label class="sw-form-field">
      <span class="sw-label">You are</span>
      <select class="sw-field-underline" id="role" name="role">
        <option>An operating MGA</option>
        <option>A carrier</option>
        <option>An underwriter launching an MGA</option>
        <option>A broker</option>
      </select>
    </label>
    <label class="sw-form-field sw-form-full">
      <span class="sw-label">What do you want to talk about?</span>
      <textarea class="sw-field-underline" id="message" name="message" rows="3" placeholder="Lines of business, provinces, current GWP, timeline"></textarea>
    </label>
    <div class="sw-form-full" style="display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px">
      <button class="sw-button" type="submit" id="contact-submit">Send message &rarr;</button>
      <span style="font-size:13px;color:var(--sw-muted)">Or email <a href="mailto:hello@slypway.com">hello@slypway.com</a></span>
    </div>
    <p id="contact-error" class="sw-error sw-form-full" style="display:none"></p>
  </form>

  <div id="contact-sent" style="display:none;margin-top:32px">
    <div class="sw-eyebrow sw-eyebrow-accent">&#10003; Message sent</div>
    <p style="margin:14px 0 0;max-width:40rem;font-family:var(--font-heading);font-weight:600;font-size:20px;line-height:1.35;color:var(--sw-fg)">Thanks. We will reply within 2 business days.</p>
    <a href="/index.html" style="display:inline-block;margin-top:24px;font-family:var(--font-mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase">&larr; Back to home</a>
  </div>
</main>

<footer class="sw-footer">
  <div class="sw-footer-inner">&copy; 2026 Slypway</div>
</footer>

<script src="/assets/prelaunch.js?v=1"></script>
<script>
(function () {
  var sw = window.SwPrelaunch;
  document.getElementById("contact-form").addEventListener("submit", async function (event) {
    event.preventDefault();
    var button = document.getElementById("contact-submit");
    var errorEl = document.getElementById("contact-error");
    errorEl.style.display = "none";
    var payload = {
      name: document.getElementById("name").value.trim(),
      email: document.getElementById("email").value.trim(),
      company: document.getElementById("company").value.trim(),
      role: document.getElementById("role").value,
      message: document.getElementById("message").value.trim(),
    };
    if (!payload.name || !payload.email) {
      errorEl.textContent = "Enter your name and work email.";
      errorEl.style.display = "block";
      return;
    }
    button.disabled = true;
    button.textContent = "Sending";
    try {
      await sw.postJSON("/api/contact", payload);
      document.getElementById("contact-form").style.display = "none";
      document.getElementById("contact-sent").style.display = "block";
    } catch (err) {
      errorEl.textContent = "We could not send this right now. Please email hello@slypway.com.";
      errorEl.style.display = "block";
      button.disabled = false;
      button.textContent = "Send message →";
    }
  });
})();
</script>
</body>
</html>
