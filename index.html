<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slypway for Insurance</title>
<meta name="description" content="Slypway for Insurance is coming soon.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root{--sw-bg:#0B0D0E;--sw-fg:#F4F2EE;--sw-accent:#3B82F6;--sw-error:#F4664A}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--sw-bg);
    color:var(--sw-fg);
    font-family:Inter,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a{color:inherit}
  ::selection{background:var(--sw-accent);color:var(--sw-bg)}

  .hero{
    position:relative;
    width:100%;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    justify-content:center;
    padding:clamp(24px,6vw,80px);
    overflow:hidden;
  }
  .hero video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:0;
  }
  .hero-overlay{
    position:absolute;
    inset:0;
    z-index:1;
    background:linear-gradient(180deg, rgba(11,13,14,.55) 0%, rgba(11,13,14,.72) 55%, rgba(11,13,14,.88) 100%);
  }
  .hero-content{
    position:relative;
    z-index:2;
    max-width:720px;
  }
  .wordmark{
    font-family:'Hanken Grotesk',sans-serif;
    font-weight:800;
    font-size:20px;
    letter-spacing:-0.03em;
    margin-bottom:clamp(48px,10vh,120px);
  }
  h1{
    font-family:'Hanken Grotesk',sans-serif;
    font-weight:700;
    font-size:clamp(34px,6vw,64px);
    line-height:normal;
    letter-spacing:-0.03em;
    margin:0 0 28px;
    text-wrap:pretty;
  }
  h1 .highlight{
    display:inline;
    background:var(--sw-accent);
    color:var(--sw-fg);
    padding:0.05em 0.15em;
    -webkit-box-decoration-break:clone;
    box-decoration-break:clone;
  }
  .lede{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--sw-accent);
    margin:0 0 8px;
  }
  form{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:12px;
  }
  input[type="email"]{
    flex:1 1 260px;
    min-width:0;
    background:transparent;
    border:1px solid rgba(244,242,238,.4);
    color:var(--sw-fg);
    font-family:Inter,sans-serif;
    font-size:16px;
    padding:14px 16px;
    border-radius:0;
  }
  input[type="email"]::placeholder{color:rgba(244,242,238,.5)}
  input[type="email"]:focus{outline:2px solid var(--sw-accent);outline-offset:2px;border-color:var(--sw-accent)}
  button{
    flex:0 0 auto;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    background:var(--sw-accent);
    color:var(--sw-bg);
    border:1px solid var(--sw-accent);
    padding:14px 22px;
    cursor:pointer;
    transition:opacity .2s ease;
  }
  button:hover{opacity:.85}
  button:disabled{opacity:.5;cursor:default}
  .status{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:0.03em;
    margin-top:16px;
    min-height:16px;
  }
  .status[data-state="success"]{color:var(--sw-accent)}
  .status[data-state="error"]{color:var(--sw-error)}
</style>
</head>
<body>
<section class="hero">
  <video
    autoplay
    muted
    loop
    playsinline
    poster="assets/hero-poster.jpg"
  >
    <source src="assets/hero.mp4" type="video/mp4">
  </video>
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <div class="wordmark">Slypway</div>
    <p class="lede">Coming soon</p>
    <h1><span class="highlight">Slypway for Insurance. Launching soon.</span></h1>
    <form id="signup-form" novalidate>
      <input type="email" id="email" name="email" placeholder="you@company.com" autocomplete="email" required>
      <button type="submit">Get notified when we launch</button>
    </form>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </div>
</section>
<script>
  var form = document.getElementById('signup-form');
  var emailInput = document.getElementById('email');
  var statusEl = document.getElementById('status');
  var submitBtn = form.querySelector('button');

  function setStatus(message, state){
    statusEl.textContent = message;
    if(state){
      statusEl.setAttribute('data-state', state);
    } else {
      statusEl.removeAttribute('data-state');
    }
  }

  form.addEventListener('submit', function(evt){
    evt.preventDefault();
    var email = emailInput.value.trim();
    submitBtn.disabled = true;
    setStatus('Submitting...', null);

    fetch('/api/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email })
    })
      .then(function(res){
        return res.json().catch(function(){ return {}; }).then(function(data){
          return { ok: res.ok, data: data };
        });
      })
      .then(function(result){
        submitBtn.disabled = false;
        if(result.ok){
          setStatus('You are on the list. We will let you know when we launch.', 'success');
          form.reset();
        } else {
          setStatus((result.data && result.data.error) || 'Something went wrong. Please try again.', 'error');
        }
      })
      .catch(function(){
        submitBtn.disabled = false;
        setStatus('Something went wrong. Please try again.', 'error');
      });
  });
</script>
</body>
</html>
